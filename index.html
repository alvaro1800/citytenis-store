<style>
body { font-family: Arial; margin: 0; background: #f5f5f5; }
header { background: #000; color: white; padding: 20px; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
.card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

/* CARRUSEL CON PUNTOS */
.carrusel { position: relative; overflow: hidden; border-radius: 8px; }
.carrusel img { width: 100%; display: none; }
.carrusel img.activa { display: block; }
.puntos { text-align: center; padding: 10px 0; }
.punto { display: inline-block; width: 10px; height: 10px; background: #ccc; border-radius: 50%; margin: 0 4px; cursor: pointer; transition: 0.3s; }
.punto.activo { background: #000; transform: scale(1.2); }

.btn { background: #000; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
</style>
</head>

    </div>
