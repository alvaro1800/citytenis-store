  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; }

    /* PÁGINA INICIO */
    .inicio {
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=2070') no-repeat center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      background-color: rgba(0,0,0,0.6);
      background-blend-mode: darken;
    }
    .inicio h1 { font-size: 4rem; margin-bottom: 15px; text-shadow: 2px 2px 8px black; letter-spacing: 2px; }
    .inicio p { font-size: 1.3rem; margin-bottom: 30px; }
    .btn-catalogo {
      background: #ff2d55;
      color: white;
      padding: 16px 45px;
      font-size: 1.1rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn-catalogo:hover { background: #e0003f; transform: scale(1.05); }

    /* PÁGINA CATÁLOGO */
    .catalogo { display: none; padding: 50px 20px; background: #f5f5f5; min-height: 100vh; }
    .catalogo h2 { text-align: center; font-size: 2.5rem; margin-bottom: 40px; }
    .grid-productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .producto {
      background: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: 0.3s;
    }
    .producto:hover { transform: translateY(-8px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    
    /* AQUI ESTA LO NUEVO DEL CARRUSEL */
    .carrusel { 
      display: flex; 
      overflow-x: auto; 
      scroll-snap-type: x mandatory; 
      width: 100%; 
      border-radius: 10px;
      scroll-behavior: smooth;
      margin-bottom: 10px;
    }
    .carrusel::-webkit-scrollbar { display: none; } /* Oculta la barra */
    .carrusel img { 
      width: 100%; 
      flex-shrink: 0; 
      scroll-snap-align: start;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #f8f8f8;
      border-radius: 10px;
      padding: 12px;
    }
    .puntos { 
      display: flex; 
      justify-content: center; 
      gap: 8px; 
      margin-bottom: 12px;
    }
    .punto { 
      width: 10px; 
      height: 10px; 
      border-radius: 50%; 
      background: #ccc; 
      border: none; 
      cursor: pointer;
      transition: 0.3s;
    }
    .punto.activo { background: #ff2d55; transform: scale(1.2); }

    .producto h3 { font-size: 16px; margin-bottom: 8px; }
    .producto p { font-size: 20px; font-weight: bold; color: #ff2d55; margin-bottom: 12px; }
    
    .btn-vinted {
      display: block;
      background: #09b1ba;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: 0.3s;
    }
    .btn-vinted:hover { background: #078f96; }

    .btn-volver {
      display: block;
      margin: 0 auto 40px auto;
      background: black;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>

  <script>
    function mostrarCatalogo() {
      document.getElementById('inicio').style.display = 'none';
      document.getElementById('catalogo').style.display = 'block';
      window.scrollTo(0,0);
    }
    function mostrarInicio() {
      document.getElementById('catalogo').style.display = 'none';
      document.getElementById('inicio').style.display = 'flex';
    }

    // AQUI ESTA LO NUEVO PARA QUE FUNCIONEN LOS PUNTITOS
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.producto').forEach(producto => {
        const carrusel = producto.querySelector('.carrusel');
        const puntosContainer = producto.querySelector('.puntos');
        
        if (carrusel && puntosContainer) {
          const imagenes = carrusel.querySelectorAll('img');
          
          // Crear puntitos
          imagenes.forEach((_, i) => {
            const punto = document.createElement('button');
            punto.classList.add('punto');
            if (i === 0) punto.classList.add('activo');
            punto.addEventListener('click', () => {
              carrusel.scrollTo({ left: carrusel.offsetWidth * i, behavior: 'smooth' });
            });
            puntosContainer.appendChild(punto);
          });
          
          const puntos = puntosContainer.querySelectorAll('.punto');
          
          // Marcar puntito activo al deslizar
          carrusel.addEventListener('scroll', () => {
            const indiceActual = Math.round(carrusel.scrollLeft / carrusel.offsetWidth);
            puntos.forEach((p, i) => {
              p.classList.toggle('activo', i === indiceActual);
            });
          });
        }
      });
    });
  </script>
